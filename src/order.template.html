<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order confirmation — Plassiv</title>
  <meta name="description" content="Your Plassiv order confirmation.">
  <meta name="robots" content="noindex">
<!--HEAD-->
</head>
<body class="overflow-x-hidden antialiased">
<!--SPRITE-->

<a href="#main" class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-50 focus:rounded-sm focus:bg-white focus:px-4 focus:py-2 focus:text-ink">Skip to content</a>

<!--NAV-->
<div class="nav-spacer bg-[#2a0309]" aria-hidden="true"></div>

<main id="main" class="container-x pt-10 lg:pt-16" data-order-root>
  <p data-order-loading class="py-16 text-center text-sm text-muted">Loading your order…</p>
  <noscript><p class="text-center text-sm">This page needs JavaScript to show your order.</p></noscript>

  <section data-order-missing class="hidden py-12 text-center lg:py-20" aria-labelledby="missing-title">
    <span class="mx-auto grid size-16 place-items-center rounded-full border border-gold/50 bg-paper-deep text-brand"><svg class="icon size-7" aria-hidden="true"><use href="#i-package"/></svg></span>
    <h1 id="missing-title" class="title mt-6 text-[clamp(2rem,3.5vw,3rem)]">We couldn’t find that order</h1>
    <p class="mx-auto mt-3 max-w-md text-sm text-muted">Orders in this demo shop are saved in the browser they were placed in, so the link only works there. It may also have been cleared with your browsing data.</p>
    <a href="index.html#shop" class="mt-7 btn btn-ink">Back to the shop <svg class="icon size-4" aria-hidden="true"><use href="#i-chevron-right"/></svg></a>
  </section>
</main>

<!--FOOTER-->

<!--CART-->
<!--SEARCH-->
<!--LOGIN-->

<script src="js/lazy.js" defer></script>
<script src="js/main.js" defer></script>
<script type="module" src="js/boot.js" data-now="cart-drawer.js nav.js order.js" data-later="search.js login.js footer-silk.js"></script>
</body>
</html>
