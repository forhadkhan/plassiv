
<!-- ============ LOGIN (behaviour in js/login.js; there is no account system yet, so every sign-in is refused) ============ -->
<dialog id="login-dialog" class="login-dialog" aria-labelledby="login-title">
  <div class="relative bg-[#2a0309] px-7 pb-8 pt-9 text-center text-white">
    <button type="button" data-login-close class="absolute right-3 top-3 grid size-10 place-items-center rounded-full text-white/80 transition hover:bg-white/10 hover:text-white" aria-label="Close sign in"><svg class="icon"><use href="#i-x"/></svg></button>
    <span class="mx-auto grid size-14 place-items-center rounded-full bg-white/10 ring-1 ring-white/25"><svg class="icon size-6"><use href="#i-user"/></svg></span>
    <h2 id="login-title" class="heading mt-5 text-2xl">Welcome back</h2>
    <p class="mt-1.5 text-sm text-white/70">Sign in to track orders and check out faster.</p>
  </div>
  <form data-login-form novalidate class="grid gap-5 px-7 pb-8 pt-7">
    <p data-login-alert role="alert" hidden class="flex items-start gap-2.5 rounded-xl bg-danger/10 px-4 py-3 text-sm font-medium text-danger">
      <svg class="icon mt-0.5 size-5"><use href="#i-circle-alert"/></svg>
      <span>Wrong credentials. Check your email and password and try again.</span>
    </p>
    <div>
      <label for="login-email" class="text-sm font-semibold">Email</label>
      <div class="relative">
        <svg class="icon pointer-events-none absolute left-3.5 top-1/2 mt-[.1875rem] size-5 -translate-y-1/2 text-muted" aria-hidden="true"><use href="#i-mail"/></svg>
        <input id="login-email" name="email" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com" class="input !pl-11">
      </div>
      <p data-error-for="email" class="field-error"></p>
    </div>
    <div>
      <label for="login-password" class="text-sm font-semibold">Password</label>
      <div class="relative">
        <svg class="icon pointer-events-none absolute left-3.5 top-1/2 mt-[.1875rem] size-5 -translate-y-1/2 text-muted" aria-hidden="true"><use href="#i-lock"/></svg>
        <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Your password" class="input !pl-11 !pr-12">
        <button type="button" data-login-reveal class="absolute right-1.5 top-1/2 mt-[.1875rem] grid size-9 -translate-y-1/2 place-items-center rounded-full text-muted transition hover:text-ink" aria-label="Show password" aria-pressed="false">
          <svg class="icon" data-eye><use href="#i-eye"/></svg>
          <svg class="icon hidden" data-eye-off><use href="#i-eye-off"/></svg>
        </button>
      </div>
      <p data-error-for="password" class="field-error"></p>
    </div>
    <button type="submit" data-login-submit class="mt-1 h-12 rounded-xl bg-[#c4121f] font-display text-base font-bold text-white transition hover:bg-[#e11d2e] disabled:cursor-wait disabled:opacity-70">Sign in</button>
  </form>
</dialog>
